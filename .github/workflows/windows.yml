name: Windows build
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package
      - run: node scripts/desktop-test.mjs --packaged --no-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: MyTerminal-Windows-x64
          path: release/*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-validation
          path: |
            test-results/packaged/*.png
            test-results/packaged/results.json
